<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyShield - KeyStroke Data Collector</title>
    <link rel="stylesheet" href = "style.css">
</head>
<body>
    <div class = "container">
        <h1>KeyShield</h1>
        <p class ="subtitle">
            Behavioral Biometric Authentication using KeyStroke Dynamics
        </p>
        <div class ="card">

            <label for="password">
                Type Password
            </label>
            <input
            type ="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="off"
            >
            <button id ="startBtn">
                Start Recording
            </button>
            <button id="resetBtn">
                Reset
            </button>

        </div>
        <div class ="output">
            <h2>Captured Events</h2>
            <div id ="eventLog">

            </div>
        </div>

    </div>
    <script src="script.js">
    </script>
    
</body>
</html>
